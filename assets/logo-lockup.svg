<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img" aria-label="Link Extractor 9000">
  <title>Link Extractor 9000</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f241c"/>
      <stop offset="0.6" stop-color="#0d100c"/>
      <stop offset="1" stop-color="#090b09"/>
    </linearGradient>
    <pattern id="lgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="lglow" cx="0.2" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#c7ff4a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c7ff4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ffbe"/>
      <stop offset="0.22" stop-color="#d8ff6e"/>
      <stop offset="0.52" stop-color="#a8e42b"/>
      <stop offset="0.82" stop-color="#6ea515"/>
      <stop offset="1" stop-color="#4d7a0d"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7b0"/>
      <stop offset="0.45" stop-color="#ffbd59"/>
      <stop offset="1" stop-color="#d4820f"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#101a04" flood-opacity="0.45"/>
    </filter>
    <clipPath id="panelClip"><rect width="600" height="180" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="600" height="180" fill="url(#panel)"/>
    <rect width="600" height="180" fill="url(#lgrid)"/>
    <rect width="600" height="180" fill="url(#lglow)"/>
    <rect width="4" height="180" fill="#c7ff4a"/>
  </g>

  <g transform="translate(28 26)" filter="url(#lift)">
    <g transform="rotate(-45 64 64) translate(64 64) scale(0.94) translate(-64 -64)">
      <g fill="none" stroke="#22320a" stroke-width="22" stroke-linecap="round">
        <path d="M56 44H40a20 20 0 0 0 0 40h16"/>
        <path d="M72 44h16a20 20 0 0 1 0 40H72"/>
      </g>
      <rect x="43" y="54" width="42" height="20" rx="10" fill="#22320a"/>
      <g fill="none" stroke="url(#tube)" stroke-width="13" stroke-linecap="round">
        <path d="M56 44H40a20 20 0 0 0 0 40h16"/>
        <path d="M72 44h16a20 20 0 0 1 0 40H72"/>
      </g>
      <rect x="47.5" y="58.5" width="33" height="11" rx="5.5" fill="url(#barGrad)"/>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.4" stroke-linecap="round" transform="translate(0 -2.7)">
        <path d="M54 44H41a20 20 0 0 0 -14 8"/>
        <path d="M74 44h13a20 20 0 0 1 14 8"/>
      </g>
      <rect x="50" y="59.5" width="24" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.5"/>
    </g>
  </g>

  <text x="190" y="62" fill="#98a18f" font-family="ui-monospace,'Cascadia Code','Liberation Mono',monospace" font-size="12" font-weight="700" letter-spacing="4.2">URL COLLECTION UNIT</text>
  <text x="188" y="108" fill="#f3f2e9" font-family="'Avenir Next','Segoe UI Variable','Segoe UI',system-ui,sans-serif" font-size="40" font-weight="650" letter-spacing="-1.4">Link Extractor <tspan fill="#c7ff4a" font-weight="800">9000</tspan></text>
  <rect x="190" y="126" width="44" height="3" fill="#ffbd59"/>
  <text x="246" y="132" fill="#70796b" font-family="ui-monospace,'Cascadia Code','Liberation Mono',monospace" font-size="11" letter-spacing="2.4">LOCAL ONLY / NO TELEMETRY</text>
</svg>
